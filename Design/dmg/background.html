<!doctype html>
<html lang="fr">
<!--
  Background of the NOYA Files disk image window, 660 × 420 points.
  Rendered to background.png and background@2x.png by Design/dmg/render.js.
  Finder draws the two icons on top: the app centered at (180, 196),
  Applications at (480, 196). Keep the arrow and texts clear of them.
-->
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 660px; height: 420px; overflow: hidden; }
  body {
    font-family: -apple-system, "SF Pro Text", "Inter", "Helvetica Neue", Arial, sans-serif;
    background:
      radial-gradient(520px 260px at 50% -40px, rgba(10, 59, 192, 0.10), transparent 70%),
      linear-gradient(180deg, #FBFCFF 0%, #EEF2FC 100%);
    color: #0B1B4D;
    position: relative;
  }
  .title { position: absolute; top: 34px; width: 100%; text-align: center; }
  .title h1 { margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -0.2px; }
  .title p { margin: 5px 0 0; font-size: 12.5px; color: #5B6788; }
  .slot {
    position: absolute; top: 132px; width: 150px; height: 150px; margin-left: -75px;
    border-radius: 30px; background: rgba(255, 255, 255, 0.75);
    box-shadow: 0 1px 2px rgba(11, 27, 77, 0.06), 0 8px 24px rgba(11, 27, 77, 0.07);
    border: 1px solid rgba(11, 27, 77, 0.06);
  }
  .arrow { position: absolute; left: 262px; top: 172px; width: 136px; height: 48px; }
  .hint { position: absolute; top: 318px; width: 100%; text-align: center; }
  .hint strong { display: block; font-size: 14.5px; font-weight: 600; }
  .hint span { display: block; margin-top: 4px; font-size: 11.5px; color: #7280A3; }
  .footer {
    position: absolute; bottom: 18px; width: 100%; text-align: center;
    font-size: 10.5px; color: #98A3BF; letter-spacing: 0.2px;
  }
</style>
</head>
<body>
  <div class="title">
    <h1>NOYA Files</h1>
    <p>Un chez-soi plus intelligent pour vos fichiers</p>
  </div>
  <div class="slot" style="left: 180px"></div>
  <div class="slot" style="left: 480px"></div>
  <svg class="arrow" viewBox="0 0 136 48" aria-hidden="true">
    <defs>
      <linearGradient id="a" x1="0" x2="1">
        <stop offset="0" stop-color="#0A3BC0" stop-opacity="0.35"/>
        <stop offset="1" stop-color="#0A3BC0"/>
      </linearGradient>
    </defs>
    <path d="M6 30 C 40 6, 92 6, 122 26" fill="none" stroke="url(#a)" stroke-width="3.5"
          stroke-linecap="round" stroke-dasharray="1 9"/>
    <path d="M112 15 L 125 27 L 108 31" fill="none" stroke="#0A3BC0" stroke-width="3.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  <div class="hint">
    <strong>Glissez NOYA Files dans le dossier Applications</strong>
    <span>Drag NOYA Files to the Applications folder</span>
  </div>
  <div class="footer">NOYA 360 · Logiciel libre, GPL v3</div>
</body>
</html>
