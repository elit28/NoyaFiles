<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="0.55" stop-color="#0E9AA7"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E3F7F5"/>
    </linearGradient>
    <linearGradient id="mono" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B8A6"/>
      <stop offset="1" stop-color="#1E40AF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B2545" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle background on the macOS icon grid (824 × 824, centred). -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shine)"/>

  <!-- Folder back with its tab. -->
  <path d="M262 352 a40 40 0 0 1 40 -40 h150 c26 0 34 38 60 38 h210 a40 40 0 0 1 40 40 v300 h-500 z"
        fill="#FFFFFF" fill-opacity="0.42"/>

  <!-- Folder front. -->
  <g filter="url(#soft)">
    <rect x="232" y="420" width="560" height="330" rx="48" fill="url(#front)"/>
  </g>

  <!-- N monogram. -->
  <path d="M428 676 V494 L596 676 V494" fill="none" stroke="url(#mono)" stroke-width="58"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
