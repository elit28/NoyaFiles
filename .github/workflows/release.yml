name: Release

# Builds a release on its own when the version of the app changes on main
# (MARKETING_VERSION in the Xcode project, set with scripts/set-version.sh).
# A version tag such as v0.2.0, or "Run workflow" in the Actions tab, also starts it.
# The release is published right away, with the .dmg attached.
#
# Signing and notarization are optional. They need these repository secrets:
#   MACOS_CERTIFICATE_P12        Developer ID Application certificate (.p12), base64-encoded
#   MACOS_CERTIFICATE_PASSWORD   Password of the .p12 file
#   APPLE_TEAM_ID                Apple Developer team ID
#   APPLE_ID                     Apple ID email used for notarization
#   APPLE_APP_SPECIFIC_PASSWORD  App-specific password of that Apple ID
# Without them, the app is signed ad hoc and macOS shows a warning on first launch.
#
# Updates inside the app (Sparkle) need one more secret:
#   SPARKLE_PRIVATE_KEY          Private key matching SUPublicEDKey in Config/Info.plist
# It signs the .dmg and the release gets an appcast.xml, which installed apps read to
# offer the new version. Without it, the release is published without that feed.

on:
  push:
    branches: [main]
    tags: ["v*"]
    # On main, only when the project (where the version lives) or this workflow changes.
    # GitHub ignores these paths for tag pushes.
    paths:
      - NoyaFiles.xcodeproj/project.pbxproj
      - .github/workflows/release.yml
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, such as 0.2.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check the version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v7

      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/release-version.sh

  release:
    name: Build, sign and publish
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Import the signing certificate
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: scripts/ci/import-certificate.sh

      - name: Check translations
        run: python3 scripts/check-localizations.py

      - name: Run core tests
        run: swift test --package-path Packages/NoyaCore

      - name: Build the app
        run: scripts/build-app.sh
        env:
          MARKETING_VERSION: ${{ needs.version.outputs.version }}
          BUILD_NUMBER: ${{ needs.version.outputs.build }}

      - name: Check links to recent frameworks
        run: scripts/ci/check-weak-links.sh

      - name: Create and notarize the disk image
        run: scripts/make-dmg.sh

      - name: Sign the update for installed apps
        if: env.SPARKLE_PRIVATE_KEY != ''
        run: scripts/ci/make-appcast.sh "${{ needs.version.outputs.version }}"

      - name: Warn that installed apps will not see this update
        if: env.SPARKLE_PRIVATE_KEY == ''
        run: |
          echo "::warning title=No update feed::The SPARKLE_PRIVATE_KEY secret is missing, so this release has no appcast.xml and installed apps will not offer it as an update."

      - name: Publish the release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.version.outputs.version }}
          # The tag is created on the commit that was built.
          target_commitish: ${{ github.sha }}
          name: NOYA Files ${{ needs.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(needs.version.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.sha256
            dist/appcast.xml
