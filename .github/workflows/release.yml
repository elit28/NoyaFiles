name: Release

# Builds a release when a version tag such as v0.2.0 is pushed, or on demand.
# The release is created as a draft, to be reviewed and published by hand.
#
# Signing and notarization are optional. They need these repository secrets:
#   MACOS_CERTIFICATE_P12        Developer ID Application certificate (.p12), base64-encoded
#   MACOS_CERTIFICATE_PASSWORD   Password of the .p12 file
#   APPLE_TEAM_ID                Apple Developer team ID
#   APPLE_ID                     Apple ID email used for notarization
#   APPLE_APP_SPECIFIC_PASSWORD  App-specific password of that Apple ID
# Without them, the app is signed ad hoc and macOS shows a warning on first launch.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, such as 0.2.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build, sign and publish
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Work out the version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "error: '$version' is not a version such as 1.2.3" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Import the signing certificate
        if: env.MACOS_CERTIFICATE_P12 != ''
        run: scripts/ci/import-certificate.sh

      - name: Check translations
        run: python3 scripts/check-localizations.py

      - name: Run core tests
        run: swift test --package-path Packages/NoyaCore

      - name: Build the app
        run: scripts/build-app.sh
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Create and notarize the disk image
        run: scripts/make-dmg.sh

      - name: Create the draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: NOYA Files ${{ steps.version.outputs.version }}
          draft: true
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.sha256
