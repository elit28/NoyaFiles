name: Signaler un bug
description: Quelque chose ne marche pas comme prévu.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de signaler ce problème. Pour une faille de sécurité, suivez plutôt SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: Que s'est-il passé ?
      description: Ce que vous avez fait, ce que vous attendiez, et ce qui s'est passé à la place.
      placeholder: "J'ai mis un fichier à la Corbeille avec ⌘⌫, puis cliqué sur Annuler : le fichier n'est pas revenu."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      placeholder: |
        1. Ouvrir Téléchargements
        2. …
  - type: input
    id: app-version
    attributes:
      label: Version de NOYA Files
      description: NOYA Files › À propos de NOYA Files
      placeholder: "0.2.4"
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: Version de macOS et modèle de Mac
      placeholder: "macOS 27.2, MacBook Air M5"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Message d'erreur
      description: |
        Si l'app ne démarre pas, lancez-la depuis le Terminal et collez ce qui s'affiche :
        "/Applications/NOYA Files.app/Contents/MacOS/NOYA Files"
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: Captures d'écran
      description: Glissez-les ici si elles aident à comprendre.
